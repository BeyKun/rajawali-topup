services:
  rajawali-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rajawali_topup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-false}
    volumes:
      - rajawali_storage_app:/var/www/html/storage/app
      - rajawali_storage_logs:/var/www/html/storage/logs
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nginx-proxy-manager_default

volumes:
  rajawali_storage_app:
    name: rajawali_storage_app
  rajawali_storage_logs:
    name: rajawali_storage_logs

networks:
  nginx-proxy-manager_default:
    external: true
