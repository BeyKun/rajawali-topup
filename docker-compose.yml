services:
  rajawali-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rajawali_topup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
    volumes:
      - rajawali_storage_app:/var/www/html/storage/app
      - rajawali_storage_logs:/var/www/html/storage/logs
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx-proxy-manager_default

volumes:
  rajawali_storage_app:
    name: rajawali_storage_app
  rajawali_storage_logs:
    name: rajawali_storage_logs

networks:
  nginx-proxy-manager_default:
    external: true
